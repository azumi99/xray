# AWB Queries

query SearchAwbs($search: String, $first: Int, $page: Int) {
  searchAirwaybillxrays(search: $search, first: $first, page: $page) {
    data {
      id
      airwaybill_number
      photo_airwaybill
      created_at
      updated_at
      xray_photos_count
    }
    paginatorInfo {
      count
      currentPage
      firstItem
      hasMorePages
      lastItem
      lastPage
      perPage
      total
    }
  }
}

query SearchAwbByNumber($airwaybill_number: String!) {
  airwaybillXrayByNumber(airwaybill_number: $airwaybill_number) {
    id
    airwaybill_number
    photo_airwaybill
    created_at
    updated_at
    xray_photos_count
  }
}

query GetAwb($id: ID!) {
  airwaybillXrayWithDetails(id: $id) {
    id
    airwaybill_number
    photo_airwaybill
    created_at
    xray_photos_count
    airwaybillXrayDetails {
      id
      id_airwaybill
      xray_photo
      created_at
    }
  }
}