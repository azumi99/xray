# AWB Queries

query GetAwbList {
  airwaybillXrays(first: 50, page: 1) {
    data {
      id
      airwaybill_number
      photo_airwaybill
      created_at
      updated_at
      xray_photos_count
    }
    paginatorInfo {
      currentPage
      lastPage
      total
    }
  }
}

query GetAwb($id: ID!) {
  airwaybillXrayWithDetails(id: $id) {
    id
    airwaybill_number
    photo_airwaybill
    created_at
    xray_photos_count
    airwaybillXrayDetails {
      id
      id_airwaybill
      xray_photo
      created_at
    }
  }
}