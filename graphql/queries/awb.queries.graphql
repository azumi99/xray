# AWB Queries

query GetAwbList {
  airwaybillXrays(first: 50, page: 1) {
    data {
      id
      airwaybill_number
      photo_airwaybill
      created_at
      updated_at
      xray_photos_count
    }
    paginatorInfo {
      currentPage
      lastPage
      total
    }
  }
}

query GetAwb($id: ID!) {
  airwaybillXrayDetail(id: $id) {
    id
    airwaybill_number
    photo_airwaybill
    xray_photos {
      id
      photo_url
      created_at
    }
    created_at
    updated_at
  }
}